name: Fork release
on:
  release:
    types: [published]
permissions:
  contents: read
env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: ps5-mqtt-home-assistant-add-on
  BUILD_IMAGE_NAME: ps5-mqtt-home-assistant-add-on-build
jobs:
  init:
    name: 🧮 Prepare build matrix
    if: ${{ contains(github.event.release.tag_name, '-jean') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      registry-prefix: ${{ steps.registry.outputs.prefix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: 🧮 Check tag matches config.yaml
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          grep -qx "version: ${version}" add-ons/ps5-mqtt/config.yaml \
            || { echo "::error::config.yaml version is not ${version}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: 🏷 Compute registry prefix
        id: registry
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: 🧮 Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.BUILD_IMAGE_NAME }}
          registry-prefix: ${{ steps.registry.outputs.prefix }}

  prepare:
    name: 👨‍🏭 Build & package app
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: 🧶 Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: yarn

      - name: ⏬ Install dependencies
        run: yarn install --immutable

      - name: ⏭ Sync add-on docs
        run: |
          cp README.md add-ons/ps5-mqtt/README.md
          cp docs/DOCS.md add-ons/ps5-mqtt/DOCS.md

      - name: 👨‍🏭 Build App
        run: yarn build

      - name: 🧪 Run unit tests
        run: yarn test/unit

      - name: 📦 Package App
        env:
          PREPARE_ONLY: "1"
          SKIP_BUILD: "1"
        run: yarn workspace @ps5-mqtt/server package

      - name: 🗂 Assemble add-on Docker context
        run: |
          cp add-ons/common/Dockerfile add-ons/ps5-mqtt/
          cp add-ons/common/build.yaml add-ons/ps5-mqtt/
          cp add-ons/common/.dockerignore add-ons/ps5-mqtt/
          cp add-ons/common/run.sh add-ons/ps5-mqtt/
          mkdir -p add-ons/ps5-mqtt/ps5-mqtt/server
          cp -R ps5-mqtt/server/.packaged add-ons/ps5-mqtt/ps5-mqtt/server/.packaged

      - name: ⏫ Upload add-on context
        uses: actions/upload-artifact@v7
        with:
          name: addon-context
          path: add-ons/ps5-mqtt
          include-hidden-files: true
          if-no-files-found: error

  build:
    name: 🏭 Build & Publish add-on ${{ matrix.arch }}
    needs: [init, prepare]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: ⏬ Download prepared add-on context
        uses: actions/download-artifact@v8
        with:
          name: addon-context
          path: add-ons/ps5-mqtt

      - name: 🏭 Build & Publish add-on ps5-mqtt-${{ matrix.arch }}
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./add-ons/ps5-mqtt
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.21
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          version: ${{ needs.init.outputs.version }}
          push: true

  manifest:
    name: 📦 Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: 📦 Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.BUILD_IMAGE_NAME }}
          registry-prefix: ${{ needs.init.outputs.registry-prefix }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest

      - name: 🏷️ Promote multi-arch manifest
        env:
          PREFIX: ${{ needs.init.outputs.registry-prefix }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${PREFIX}/${IMAGE_NAME}:${VERSION}" \
            --tag "${PREFIX}/${IMAGE_NAME}:latest" \
            "${PREFIX}/${BUILD_IMAGE_NAME}:${VERSION}"
